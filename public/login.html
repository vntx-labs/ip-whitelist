<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TITAN GATEWAY — Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { background: #0d1117; color: #c9d1d9; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 32px; width: 380px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; }
        button { width: 100%; padding: 10px; background: #238636; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ TITAN GATEWAY</h2>
        <p style="color: #8b949e; font-size: 0.9rem; margin-bottom: 20px;">Bitte anmelden</p>
        
        <div id="g_id_onload" data-client_id="{{GOOGLE_CLIENT_ID}}" data-login_uri="https://ip-whitelist.onrender.com/api/auth/google" data-auto_prompt="false"></div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-width="316"></div>

        <form action="/api/auth/login" method="POST" style="margin-top: 20px;">
            <input type="email" name="email" placeholder="E-Mail" required>
            <input type="password" name="password" placeholder="Passwort" required>
            <button type="submit">Mit E-Mail anmelden</button>
        </form>
    </div>
</body>
</html>

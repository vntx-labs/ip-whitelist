<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TITAN — Hilfe-Formular</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 32px; width: 450px; text-align: center; }
        textarea { width: 100%; height: 120px; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; resize: none; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #238636; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🆘 Hilfe-Formular</h2>
        <p style="color: #8b949e; font-size: 0.85rem; margin-bottom: 20px;">Schildern Sie hier Ihr Problem an {{ADMIN_EMAIL}}.</p>
        <form action="/api/help/submit" method="POST">
            <textarea name="message" placeholder="Beschreiben Sie Ihr Problem..." required></textarea>
            <button type="submit">Nachricht senden</button>
        </form>
        <br>
        <a href="/login.html" style="color: #58a6ff; text-decoration: none; font-size: 0.85rem;">← Zurück zum Login</a>
    </div>
</body>
</html>

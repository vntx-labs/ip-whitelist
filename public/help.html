<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN — Hilfe-Formular</title>
    <style>
        :root { --bg:#03050a; --card:rgba(13,18,30,0.72); --border:rgba(255,255,255,0.1); --accent:#00f2ff; --blue:#3b82f6; --violet:#8b5cf6; --text:#eef2ff; --muted:#8b9bb4; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; font-family:'Inter','Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; padding:20px; overflow:hidden; }
        .bg-grid { position:fixed; inset:0; z-index:-2; background-image:linear-gradient(rgba(0,242,255,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,242,255,0.035) 1px,transparent 1px); background-size:48px 48px; }
        .aurora { position:fixed; width:540px; height:540px; border-radius:50%; filter:blur(130px); opacity:0.2; z-index:-2; background:radial-gradient(circle,var(--accent),transparent 70%); }
        .card { position:relative; width:100%; max-width:460px; background:var(--card); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border); border-radius:24px; padding:36px 32px; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,0.75); overflow:hidden; animation:reveal .55s cubic-bezier(.16,1,.3,1); }
        .card::before { content:""; position:absolute; top:0; left:-50%; width:200%; height:2px; background:linear-gradient(90deg,transparent,var(--accent),var(--violet),transparent); animation:scan 4s linear infinite; }
        @keyframes scan { 0%{transform:translateX(-30%)} 100%{transform:translateX(30%)} }
        @keyframes reveal { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
        h2 { margin:0 0 8px; font-size:22px; background:linear-gradient(90deg,#fff,var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        p { color:var(--muted); font-size:13.5px; margin:0 0 22px; }
        textarea { width:100%; height:135px; padding:14px; background:rgba(5,8,15,0.75); border:1px solid rgba(255,255,255,0.1); color:#fff; border-radius:14px; resize:none; margin-bottom:16px; outline:none; font-family:inherit; font-size:14px; transition:.25s; }
        textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,242,255,0.14); }
        button { width:100%; padding:14px; background:linear-gradient(135deg,var(--accent),var(--blue)); color:#020617; border:none; border-radius:12px; cursor:pointer; font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:1.2px; box-shadow:0 8px 25px rgba(0,242,255,0.25); transition:.25s; margin-bottom:20px; }
        button:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(0,242,255,0.4); }
        a.back { color:#93c5fd; text-decoration:none; font-size:13px; font-weight:600; }
        a.back:hover { color:var(--accent); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="aurora"></div>
    <div class="card">
        <h2>🆘 Hilfe-Formular</h2>
        <p>Schildern Sie hier Ihr Problem an <strong style="color:#fff">{{ADMIN_EMAIL}}</strong>.</p>
        <form action="/api/help/submit" method="POST">
            <textarea name="message" placeholder="Beschreiben Sie Ihr Problem..." required></textarea>
            <button type="submit">Nachricht senden</button>
        </form>
        <a href="/login.html" class="back">← Zurück zum Login</a>
    </div>
</body>
</html>

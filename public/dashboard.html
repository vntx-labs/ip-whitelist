<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TITAN — Dashboard</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; padding: 40px; font-family: sans-serif; }
        .container { max-width: 800px; margin: auto; background: #161b22; padding: 24px; border-radius: 12px; border: 1px solid #30363d; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #30363d; color: #8b949e; }
        .btn-danger { background: #da3633; color: #fff; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" style="color: #58a6ff; text-decoration: none;">← Zurück</a>
        <h1>User Dashboard</h1>
        <p>Eingeloggt als: <strong>{{USER_EMAIL}}</strong></p>
        <hr style="border:0; border-top:1px solid #30363d; margin:15px 0;">
        <h3>Traffic-Verbrauch: {{USED_GB}} GB von {{LIMIT_GB}} GB</h3>
        
        <h3 style="margin-top: 25px;">Aktivitäts-Protokoll (14 Tage)</h3>
        <table>
            <tr><th>Zeitpunkt</th><th>Methode</th><th>URL</th></tr>
            {{LOGS}}
        </table>

        <form action="/api/dsgvo/delete" method="POST" onsubmit="return confirm('Account und Logs wirklich endgültig löschen?');">
            <button type="submit" class="btn-danger">DSGVO: Datenlöschung beantragen</button>
        </form>
    </div>
</body>
</html>

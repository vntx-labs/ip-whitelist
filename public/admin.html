<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN — Admin Control Center</title>
    <style>
        :root { --bg:#03050a; --card:rgba(13,18,30,0.72); --border:rgba(255,255,255,0.09); --accent:#00f2ff; --err:#ff4d6d; --text:#eef2ff; --muted:#8b9bb4; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; font-family:'Inter','Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); padding:32px 18px 60px; overflow-x:hidden; }
        #titan-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:-3; pointer-events:none; }
        .bg-grid { position:fixed; inset:0; z-index:-2; pointer-events:none; background-image:linear-gradient(rgba(255,77,109,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,242,255,0.035) 1px,transparent 1px); background-size:48px 48px; }
        .aurora { position:fixed; width:560px; height:560px; border-radius:50%; filter:blur(130px); opacity:0.18; z-index:-2; pointer-events:none; }
        .a1 { top:-200px; left:-140px; background:radial-gradient(circle,var(--err),transparent 70%); }
        .a2 { bottom:-220px; right:-140px; background:radial-gradient(circle,var(--accent),transparent 70%); }

        .container { max-width:1080px; margin:0 auto; animation:reveal .55s cubic-bezier(.16,1,.3,1); }
        @keyframes reveal { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        .back-link { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:#93c5fd; text-decoration:none; font-size:13px; font-weight:600; transition:.2s; }
        .back-link:hover { border-color:var(--accent); color:#fff; }

        .header { margin:18px 0 26px; }
        h1 { margin:0 0 6px; font-size:28px; font-weight:800; background:linear-gradient(90deg,#ff758f,var(--err)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .admin-pill { display:inline-block; padding:4px 12px; border-radius:999px; background:rgba(255,77,109,0.1); border:1px solid rgba(255,77,109,0.3); color:#fda4af; font-size:12.5px; font-family:monospace; }

        .card { background:var(--card); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); border:1px solid var(--border); border-radius:20px; padding:24px; margin-bottom:24px; box-shadow:0 20px 50px rgba(0,0,0,0.55); }
        .card h2 { margin:0 0 16px; font-size:18px; color:#fff; }
        .table-wrap { overflow-x:auto; border-radius:14px; border:1px solid rgba(255,255,255,0.07); background:rgba(5,8,15,0.5); }
        table { width:100%; border-collapse:collapse; font-size:13px; }
        th, td { text-align:left; padding:11px 14px; border-bottom:1px solid rgba(255,255,255,0.06); color:var(--muted); }
        th { color:var(--accent); font-size:11.5px; text-transform:uppercase; letter-spacing:.8px; background:rgba(255,255,255,0.02); }
        tr:hover td { background:rgba(255,255,255,0.02); color:#e2e8f0; }
    </style>
</head>
<body>
    <canvas id="titan-canvas"></canvas>
    <div class="bg-grid"></div>
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>

    <div class="container">
        <a href="/index.html" class="back-link">← Zur Startseite</a>
        <div class="header">
            <h1>⚡ Admin Control Center</h1>
            <span class="admin-pill">Admin: {{ADMIN_EMAIL}}</span>
        </div>

        <div class="card">
            <h2>🆘 Offene Hilfe-Tickets (Sperr-Beschwerden)</h2>
            <div class="table-wrap">
                <table>
                    <tr><th>Zeit</th><th>Absender</th><th>Nachricht</th><th>Aktion</th></tr>
                    {{TICKETS}}
                </table>
            </div>
        </div>

        <div class="card">
            <h2>👥 Benutzer-Verwaltung &amp; Missbrauchs-Kontrolle</h2>
            <div class="table-wrap">
                <table>
                    <tr><th>ID</th><th>E-Mail</th><th>Status</th><th>Aktion</th></tr>
                    {{USERS}}
                </table>
            </div>
        </div>
    </div>

    <script>
        (function(){const c=document.getElementById('titan-canvas'),x=c.getContext('2d');let w,h;function r(){w=c.width=innerWidth;h=c.height=innerHeight}addEventListener('resize',r);r();const p=Array.from({length:innerWidth<700?22:40},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.5+.7}));(function d(){x.clearRect(0,0,w,h);for(let i=0;i<p.length;i++){const a=p[i];a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1;x.beginPath();x.arc(a.x,a.y,a.r,0,Math.PI*2);x.fillStyle='rgba(0,242,255,.45)';x.fill();for(let j=i+1;j<p.length;j++){const b=p[j],k=Math.hypot(a.x-b.x,a.y-b.y);if(k<120){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.strokeStyle=`rgba(255,77,109,${.11*(1-k/120)})`;x.lineWidth=.8;x.stroke()}}}requestAnimationFrame(d)})()})();
    </script>
</body>
</html>

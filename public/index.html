<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN GATEWAY — Startseite</title>
    <style>
        :root { --bg:#03050a; --card:rgba(13,18,30,0.72); --border:rgba(255,255,255,0.1); --accent:#00f2ff; --blue:#3b82f6; --violet:#8b5cf6; --text:#eef2ff; --muted:#8b9bb4; --err:#ff4d6d; --ok:#00ff9d; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; font-family:'Inter','Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; padding:20px; overflow-x:hidden; }
        #titan-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:-3; pointer-events:none; }
        .bg-grid { position:fixed; inset:0; z-index:-2; pointer-events:none; background-image:linear-gradient(rgba(0,242,255,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,242,255,0.035) 1px,transparent 1px); background-size:48px 48px; mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 30%,transparent 100%); -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 30%,transparent 100%); }
        .aurora { position:fixed; width:540px; height:540px; border-radius:50%; filter:blur(130px); opacity:0.22; z-index:-2; pointer-events:none; animation:drift 16s ease-in-out infinite alternate; }
        .a1 { top:-180px; left:-120px; background:radial-gradient(circle,var(--accent),transparent 70%); }
        .a2 { bottom:-200px; right:-120px; background:radial-gradient(circle,var(--violet),transparent 70%); animation-delay:-8s; }
        @keyframes drift { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(50px,35px) scale(1.12)} }

        .card { position:relative; width:100%; max-width:430px; background:var(--card); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid var(--border); border-radius:24px; padding:38px 32px 30px; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.12); overflow:hidden; animation:reveal .6s cubic-bezier(.16,1,.3,1); }
        .card::before { content:""; position:absolute; top:0; left:-50%; width:200%; height:2px; background:linear-gradient(90deg,transparent,var(--accent),var(--violet),transparent); animation:scan 4s linear infinite; }
        @keyframes scan { 0%{transform:translateX(-30%)} 100%{transform:translateX(30%)} }
        @keyframes reveal { from{opacity:0;transform:translateY(20px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }

        .emblem { position:relative; width:64px; height:64px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; }
        .emblem .orbit { position:absolute; inset:0; border-radius:50%; border:1.5px dashed rgba(0,242,255,0.45); animation:spin 14s linear infinite; }
        .emblem .core { width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg,rgba(0,242,255,0.18),rgba(59,130,246,0.15)); border:1px solid rgba(0,242,255,0.38); display:flex; align-items:center; justify-content:center; box-shadow:0 0 24px rgba(0,242,255,0.22); }
        @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }

        h2 { margin:0 0 8px; font-size:22px; font-weight:800; letter-spacing:2px; background:linear-gradient(90deg,#fff,var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .user-pill { display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); color:var(--muted); font-size:12.5px; margin-bottom:24px; }
        .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        a.btn { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:space-between; width:100%; padding:14px 18px; margin:11px 0; border-radius:14px; text-decoration:none; font-weight:700; font-size:14px; transition:all .25s cubic-bezier(.16,1,.3,1); border:1px solid transparent; }
        a.btn-primary { background:linear-gradient(135deg,var(--accent),var(--blue)); color:#020617; box-shadow:0 8px 25px rgba(0,242,255,0.25); }
        a.btn-primary:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(0,242,255,0.42); }
        a.btn-dash { background:rgba(59,130,246,0.12); border-color:rgba(59,130,246,0.35); color:#dbeafe; }
        a.btn-dash:hover { transform:translateY(-2px); background:rgba(59,130,246,0.22); border-color:var(--accent); }
        a.btn-admin { display:none; background:rgba(255,77,109,0.12); border-color:rgba(255,77,109,0.4); color:#fecdd3; }
        a.btn-admin:hover { transform:translateY(-2px); background:rgba(255,77,109,0.22); border-color:var(--err); }

        .logout-btn { width:100%; padding:11px; margin-top:16px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,77,109,0.28); color:var(--err); border-radius:12px; cursor:pointer; font-weight:700; font-size:13px; transition:.25s; }
        .logout-btn:hover { background:rgba(255,77,109,0.14); border-color:var(--err); }
    </style>
</head>
<body>
    <canvas id="titan-canvas"></canvas>
    <div class="bg-grid"></div>
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>

    <div class="card">
        <div class="emblem">
            <div class="orbit"></div>
            <div class="core">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00f2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
        </div>

        <h2>TITAN GATEWAY</h2>
        <div class="user-pill"><span class="dot"></span><span>{{USER_EMAIL}}</span></div>

        <a href="/" class="btn btn-primary"><span>1. Weiter auf Titan (Raspi)</span><span>→</span></a>
        <a href="/dashboard.html" class="btn btn-dash"><span>2. Zum Dashboard (DSGVO / Logs)</span><span>→</span></a>
        <a href="/admin.html" id="adminBtn" class="btn btn-admin"><span>3. Admin Control Center</span><span>⚡</span></a>

        <form action="/api/auth/logout" method="POST">
            <button type="submit" class="logout-btn">Abmelden</button>
        </form>
    </div>

    <script>
        const isAdminUser = "{{IS_ADMIN_USER}}" === "true";
        if (isAdminUser) {
            document.getElementById('adminBtn').style.display = 'flex';
        }
    </script>
    <script>
        (function(){const c=document.getElementById('titan-canvas'),x=c.getContext('2d');let w,h;function r(){w=c.width=innerWidth;h=c.height=innerHeight}addEventListener('resize',r);r();const p=Array.from({length:innerWidth<700?24:45},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.6+.7}));(function d(){x.clearRect(0,0,w,h);for(let i=0;i<p.length;i++){const a=p[i];a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1;x.beginPath();x.arc(a.x,a.y,a.r,0,Math.PI*2);x.fillStyle='rgba(0,242,255,.5)';x.fill();for(let j=i+1;j<p.length;j++){const b=p[j],k=Math.hypot(a.x-b.x,a.y-b.y);if(k<125){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.strokeStyle=`rgba(0,242,255,${.14*(1-k/125)})`;x.lineWidth=.8;x.stroke()}}}requestAnimationFrame(d)})()})();
    </script>
</body>
</html>
